name: Verify

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pokesleep-tool-extension
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokesleep-tool-extension/package-lock.json
      - run: npm ci
        working-directory: pokesleep-tool-extension
      - run: npm run typecheck
        working-directory: pokesleep-tool-extension
      - run: npm run lint
        working-directory: pokesleep-tool-extension
      - run: npm run test
        working-directory: pokesleep-tool-extension
      - run: npm run build
        working-directory: pokesleep-tool-extension
