name: Sync upstream data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pokesleep-tool-extension
      - uses: actions/checkout@v4
        with:
          repository: takus69/pokesleep-tool
          ref: 42b0c4ae
          path: pokesleep-tool
      - uses: actions/checkout@v4
        with:
          repository: nitoyon/pokesleep-tool
          path: upstream-source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokesleep-tool-extension/package-lock.json
      - run: npm ci
        working-directory: pokesleep-tool-extension
      - run: npm run sync:upstream-data
        working-directory: pokesleep-tool-extension
        env:
          POKESLEEP_TOOL_SOURCE: ${{ github.workspace }}/upstream-source
      - run: npm run verify
        working-directory: pokesleep-tool-extension
      - uses: peter-evans/create-pull-request@v7
        with:
          path: pokesleep-tool-extension
          base: develop
          branch: automation/sync-upstream-data
          delete-branch: true
          commit-message: "chore: sync upstream data"
          title: "chore: sync upstream data"
          body: |
            Automated, schema-validated data synchronization from `nitoyon/pokesleep-tool`.

            Review the source commit in `src/vendor/upstream-data/manifest.json` and the verification result before merging.
